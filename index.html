<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="터틀">
<title>터틀 시그널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #0A0E0D;
    --surface: #101614;
    --surface-2: #161D1B;
    --line: #223028;
    --text: #E7EDE9;
    --muted: #7C8B86;
    --mint: #35D399;
    --amber: #F0A93A;
    --rose: #F2555F;
    --slate: #5B6E68;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body{ padding-bottom:48px; }

  /* ticker */
  .ticker-wrap{
    overflow:hidden; white-space:nowrap; background:var(--surface-2);
    border-bottom:1px solid var(--line); padding:7px 0;
  }
  .ticker{
    display:inline-block; padding-left:100%;
    animation: scroll 28s linear infinite;
    font-size:11px; letter-spacing:.04em; color:var(--muted);
  }
  .ticker b{ color:var(--mint); font-weight:700; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  @media (prefers-reduced-motion: reduce){ .ticker{ animation:none; padding-left:16px; } }

  header{ padding:20px 16px 12px; }
  .eyebrow{ font-size:10px; letter-spacing:.18em; color:var(--slate); text-transform:uppercase; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; margin-top:4px; }
  .sub{ font-size:11px; color:var(--muted); margin-top:4px; }

  /* market tabs */
  .tabs{
    display:flex; gap:6px; padding:12px 16px 0; position:sticky; top:0;
    background:var(--bg); z-index:10; padding-bottom:10px;
  }
  .tab{
    flex:1; text-align:center; padding:10px 4px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.02em;
    cursor:pointer; transition:.15s;
  }
  .tab.active{ background:var(--mint); color:#04140D; border-color:var(--mint); }

  main{ padding:4px 16px 0; }
  .updated{ font-size:10px; color:var(--slate); margin:10px 2px 16px; }

  .sys-block{ margin-bottom:22px; }
  .sys-title{
    font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase;
    padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .sys-title span.tag{ color:var(--slate); font-size:9px; }

  .status-group{ margin-bottom:14px; }
  .status-head{
    display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
    margin-bottom:8px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.hold{ background:var(--mint); }
  .dot.exit{ background:var(--rose); }
  .dot.confirm{ background:var(--mint); }
  .dot.watch{ background:var(--amber); }
  .status-head .count{ color:var(--muted); font-weight:500; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-left-width:3px;
    border-radius:6px; padding:10px 12px; margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .card.c-hold, .card.c-confirm{ border-left-color:var(--mint); }
  .card.c-exit{ border-left-color:var(--rose); }
  .card.c-watch{ border-left-color:var(--amber); }
  .card .name{ font-size:13px; font-weight:600; }
  .card .code{ font-size:10px; color:var(--slate); margin-top:2px; }
  .card .metrics{ text-align:right; font-size:11px; color:var(--muted); }
  .card .metrics b{ color:var(--text); font-size:13px; }

  .empty{ font-size:11px; color:var(--slate); padding:10px 2px; }

  .loading, .err{ padding:40px 16px; text-align:center; color:var(--muted); font-size:12px; }
  .err{ color:var(--rose); }

  footer{
    text-align:center; padding:24px 16px; font-size:10px; color:var(--slate);
  }
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker" id="tickerText">데이터 불러오는 중...</div></div>

<header>
  <div class="eyebrow">Turtle Breakout Tracker</div>
  <h1>터틀 시그널</h1>
  <div class="sub">국내 · 미국 · 빗썸 20일/55일 돌파 자동 추적</div>
</header>

<div class="tabs">
  <div class="tab active" data-market="korea">국내</div>
  <div class="tab" data-market="us">미국</div>
  <div class="tab" data-market="bithumb">빗썸</div>
</div>

<main>
  <div class="updated" id="updatedText"></div>
  <div id="content"><div class="loading">불러오는 중…</div></div>
</main>

<footer>data/*.csv · GitHub Actions 자동 갱신</footer>

<script>
const FILES = {
  korea: 'data/turtle_korea_result.csv',
  us: 'data/turtle_us_result.csv',
  bithumb: 'data/turtle_bithumb_result.csv',
};
const LABELS = { korea: '국내', us: '미국', bithumb: '빗썸' };
const SYSTEMS = ['System1(단기)', 'System2(중장기)'];

let currentMarket = 'korea';
const cache = {};

function fmtNum(v){
  if(v === undefined || v === null || v === '') return '-';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString(undefined, {maximumFractionDigits:2});
}

function statusRows(rows, status){
  return rows.filter(r => r.signal === status || r.status === status);
}

function renderGroup(title, dotClass, rows, mainMetricLabel, mainMetricKey){
  const head = `<div class="status-head"><span class="dot ${dotClass}"></span>${title} <span class="count">${rows.length}개</span></div>`;
  if(rows.length === 0){
    return `<div class="status-group">${head}<div class="empty">해당 없음</div></div>`;
  }
  const cardClass = dotClass === 'exit' ? 'c-exit' : (dotClass === 'watch' ? 'c-watch' : 'c-hold');
  const cards = rows.slice(0, 50).map(r => `
    <div class="card ${cardClass}">
      <div>
        <div class="name">${r.name || r.code}</div>
        <div class="code">${r.code}</div>
      </div>
      <div class="metrics">
        <div><b>${fmtNum(r.close)}</b></div>
        <div>${mainMetricLabel} ${fmtNum(r[mainMetricKey])}</div>
      </div>
    </div>`).join('');
  return `<div class="status-group">${head}${cards}</div>`;
}

function render(market){
  const rows = cache[market];
  const content = document.getElementById('content');
  if(!rows){
    content.innerHTML = `<div class="err">아직 데이터가 없어요.<br>전체스캔 워크플로우가 최소 1회 실행된 후 확인해주세요.</div>`;
    return;
  }
  if(rows.length === 0){
    content.innerHTML = `<div class="empty">현재 신호가 있는 종목이 없습니다.</div>`;
    return;
  }

  let html = '';
  SYSTEMS.forEach(sys => {
    const sysRows = rows.filter(r => r.system === sys);
    if(sysRows.length === 0 && !rows.some(r=>r.system)) return; // system 컬럼 없는 구버전 대비

    const hold = statusRows(sysRows, '확정유지');
    const exitR = statusRows(sysRows, '확정이탈');
    const confirm = statusRows(sysRows, '확정');
    const watch = statusRows(sysRows, '관심');
    const entry = statusRows(sysRows, '진입');

    html += `<div class="sys-block">
      <div class="sys-title">${sys}<span class="tag">${sysRows.length} tracked</span></div>
      ${renderGroup('확정유지', 'hold', hold, 'N일저', 'n_low')}
      ${renderGroup('확정이탈', 'exit', exitR, 'N일저', 'n_low')}
      ${renderGroup('확정 (신규진입)', 'confirm', confirm, 'N일고', 'n_high')}
      ${renderGroup('진입', 'confirm', entry, 'N일고', 'n_high')}
      ${renderGroup('관심', 'watch', watch, 'N일고', 'n_high')}
    </div>`;
  });

  content.innerHTML = html || `<div class="empty">현재 신호가 있는 종목이 없습니다.</div>`;
}

function updateTicker(){
  let parts = [];
  Object.keys(FILES).forEach(m => {
    const rows = cache[m] || [];
    const confirm = rows.filter(r => r.signal === '확정' || r.signal === '진입').length;
    const watch = rows.filter(r => r.signal === '관심').length;
    parts.push(`${LABELS[m]} 확정 <b>${confirm}</b> · 관심 <b>${watch}</b>`);
  });
  document.getElementById('tickerText').innerHTML = parts.join('&nbsp;&nbsp;&nbsp;//&nbsp;&nbsp;&nbsp;');
}

async function loadMarket(market){
  return new Promise((resolve) => {
    Papa.parse(FILES[market] + '?t=' + Date.now(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (res) => {
        cache[market] = res.data;
        resolve();
      },
      error: () => { resolve(); }
    });
  });
}

async function init(){
  await Promise.all(Object.keys(FILES).map(loadMarket));
  updateTicker();
  render(currentMarket);
  document.getElementById('updatedText').textContent =
    '마지막 확인: ' + new Date().toLocaleString('ko-KR', {hour12:false});
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMarket = tab.dataset.market;
    render(currentMarket);
  });
});

init();
setInterval(init, 60000); // 1분마다 자동 새로고침
</script>
</body>
</html>
