name: 국내 전체스캔

on:
  schedule:
    # 2026-10-09 변경: 평일 매시간 실행 (09:00~20:00 KST, 하루 12회).
    # '0 0-11 * * 1-5' = 평일 00:00~11:00 UTC 매시 정각 = 09:00~20:00 KST.
    # (10/9 한때 30분 주기로 바꿨다가 1시간 간격으로 되돌림)
    # UTC 00~11시는 KST 09~20시로 날짜가 같아서 요일 구분(1-5)을 그대로 쓸 수 있음.
    # (공휴일은 스크립트의 is_korea_trading_day()가 걸러냄 - 수동 실행은 휴장일에도 동작)
    # GitHub 스케줄은 정각보다 몇 분~십수 분 늦게 시작될 수 있음.
    - cron: '0 0-11 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼도 사용 가능 (수동 실행은 주말에도 동작)

# 2026-10-08 추가: 스캔이 길어져 다음 정시 실행과 겹쳐도 동시에 두 개가 돌지 않도록
# 같은 그룹은 한 번에 하나만 실행 (진행 중인 스캔은 취소하지 않고 끝까지 둠).
concurrency:
  group: full-scan-korea
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-10-08 추가: 스캔이 멈춰서 이후 매시간 실행을 막는 일이 없도록 상한 설정
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 2026-09-10 추가: 한국투자증권 오픈API 연동 (가격 조회 1순위 소스).
          # 이 두 Secret이 등록되어 있지 않으면 스크립트가 자동으로 기존 fdr
          # 방식으로만 동작하므로, 등록 전에 미리 push해도 안전합니다.
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/full_scan_korea.py

      # [2026-09-22 8차 수정 - 전체 교체]
      # 🔴 이 저장소엔 5분마다 도는 워크플로우(보유종목 추적, 관심종목 재확인),
      # 텔레그램 메시지가 올 때마다 즉시 도는 웹훅, 그리고 하루 여러 번 도는
      # 전체스캔들까지 총 6개 워크플로우가 동시에 같은 data/ 폴더에 git push를
      # 시도합니다. 기존에는 이 스텝이 단순히 "commit 후 push"만 하고 있어서,
      # 다른 워크플로우가 그 사이에 먼저 push해버리면 이 push는 그냥
      # "non-fast-forward"로 거부되고 실패합니다 - 재시도 로직이 전혀 없었기
      # 때문에, 이 워크플로우가 방금 만든 변경사항(예: 보유종목 신규 등록)이
      # 원격 저장소에 반영되지 못한 채 통째로 유실되는 문제가 있었습니다.
      # 수정: push가 거부되면 원격의 최신 커밋을 rebase로 받아온 뒤 최대 5회까지
      # 재시도하도록 변경. 이 워크플로우가 만지는 파일(국장 스캔 결과)은 다른
      # 워크플로우와 겹치지 않아 rebase 충돌 가능성은 낮지만, 혹시 충돌하면
      # 자동 해결을 시도하지 않고 명확히 실패시켜서 데이터가 조용히 깨지는
      # 것을 방지합니다.
      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          # 2026-09-20 변경: 주말 스킵 시 파일이 없거나 변경이 없어도 실패하지 않도록 data/ 폴더째 add
          git add data/

          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 스킵"
            exit 0
          fi

          git commit -m "국내 전체스캔 결과 업데이트"

          # 2026-09-24 버그 수정: actions/checkout은 detached HEAD 상태로 체크아웃하므로
          # `git rev-parse --abbrev-ref HEAD`는 실제 브랜치명이 아니라 문자 그대로 "HEAD"를
          # 반환합니다. 그 상태로 `git push origin "HEAD:HEAD"`를 시도하면 "not a full
          # refname" 에러로 매번 실패합니다 - 이 저장소의 모든 5분/매시간 워크플로우가
          # "결과 커밋" 단계에서 계속 실패하던 진짜 원인이었습니다(로컬에서 동일 상황을
          # 재현해 확인함). GitHub Actions가 항상 정확한 브랜치명으로 채워주는 환경변수
          # GITHUB_REF_NAME을 우선 사용하도록 수정.
          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "푸시 성공 (시도 $i회)"
              exit 0
            fi
            echo "푸시 실패 ($i/5) - 다른 워크플로우가 먼저 push한 것으로 보입니다. 원격 변경사항을 받아와 재시도합니다."
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "::error::rebase 충돌 발생 - 자동 해결이 불가능해 수동 확인이 필요합니다."
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 6 + 2))
          done
          echo "::error::5회 재시도 후에도 push에 실패했습니다."
          exit 1
