name: 국내 전체스캔

on:
  schedule:
    # 매일 11:00 UTC = 20:00 KST
    - cron: '0 11 * * *'
  workflow_dispatch:  # 수동 실행 버튼도 사용 가능

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/full_scan_korea.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/turtle_korea_result.csv
          git diff --cached --quiet || git commit -m "국내 전체스캔 결과 업데이트"
          git push
