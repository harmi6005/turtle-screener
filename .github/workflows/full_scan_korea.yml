name: 국내 전체스캔

on:
  schedule:
    # 2026-09-14 변경: 하루 2회 -> 매시간 실행으로 확대.
    # 매시 정각(UTC 기준, KST와는 9시간 차이)에 실행. 매시간 단위 cron은 GitHub가
    # 비교적 안정적으로 지켜주는 편(5분 단위처럼 밀리는 문제가 적음)이라 별도의
    # 외부 cron-job.org 우회 없이 GitHub 자체 schedule을 그대로 사용함.
    # 실제로 스캔이 도는지 여부는 스크립트 안의 "매시간 전체스캔 on/off"
    # 설정(scan_settings.csv, 텔레그램 "국장전체스캔중지"/"국장전체스캔시작")으로
    # 별도 제어 가능.
    - cron: '0 * * * *'
  workflow_dispatch:  # 수동 실행 버튼도 사용 가능

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 2026-09-10 추가: 한국투자증권 오픈API 연동 (가격 조회 1순위 소스).
          # 이 두 Secret이 등록되어 있지 않으면 스크립트가 자동으로 기존 fdr
          # 방식으로만 동작하므로, 등록 전에 미리 push해도 안전합니다.
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/full_scan_korea.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/turtle_korea_result.csv data/kospi_tickers_cache.csv
          git diff --cached --quiet || git commit -m "국내 전체스캔 결과 업데이트"
          git push
