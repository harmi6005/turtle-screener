name: 국내 전체스캔

on:
  schedule:
    # 매일 04:00 UTC = 13:00 KST (장중 후반)
    - cron: '0 4 * * *'
    # 매일 11:00 UTC = 20:00 KST (마감 후)
    - cron: '0 11 * * *'
  workflow_dispatch:  # 수동 실행 버튼도 사용 가능

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 2026-09-10 추가: 한국투자증권 오픈API 연동 (가격 조회 1순위 소스).
          # 이 두 Secret이 등록되어 있지 않으면 스크립트가 자동으로 기존 fdr
          # 방식으로만 동작하므로, 등록 전에 미리 push해도 안전합니다.
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/full_scan_korea.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/turtle_korea_result.csv data/kospi_tickers_cache.csv
          git diff --cached --quiet || git commit -m "국내 전체스캔 결과 업데이트"
          git push
