name: 빗썸 전체스캔

on:
  schedule:
    # 00:30 KST = 15:30 UTC(전날)
    - cron: '30 15 * * *'
    # 06:30 KST = 21:30 UTC(전날)
    - cron: '30 21 * * *'
    # 12:30 KST = 03:30 UTC
    - cron: '30 3 * * *'
    # 18:30 KST = 09:30 UTC
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 빗썸 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/full_scan_bithumb.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/turtle_bithumb_result.csv
          git diff --cached --quiet || git commit -m "빗썸 전체스캔 결과 업데이트"
          git push
