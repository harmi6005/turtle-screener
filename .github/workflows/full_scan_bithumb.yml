name: 빗썸 전체스캔

on:
  schedule:
    # 2026-09-14 변경: 하루 4회 -> 매시간 실행으로 확대.
    # 실제로 스캔이 도는지 여부는 스크립트 안의 "매시간 전체스캔 on/off" 설정
    # (scan_settings.csv, 텔레그램 "코인전체스캔중지"/"코인전체스캔시작")으로
    # 별도 제어 가능. 매시간 단위 cron은 GitHub가 비교적 안정적으로 지켜주는 편.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 빗썸 전체 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/full_scan_bithumb.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/turtle_bithumb_result.csv
          git diff --cached --quiet || git commit -m "빗썸 전체스캔 결과 업데이트"
          git push
