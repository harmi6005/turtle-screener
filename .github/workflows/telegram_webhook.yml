name: 텔레그램 실시간 명령 처리

on:
  repository_dispatch:
    types: [telegram_message]

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 명령어 즉시 처리
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG_TEXT: ${{ github.event.client_payload.text }}
        run: python scripts/webhook_handler.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/holdings.csv data/watchlist.csv

          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 스킵"
            exit 0
          fi

          git commit -m "실시간 명령 처리 결과"

          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "푸시 성공 (시도 $i회)"
              exit 0
            fi
            echo "푸시 실패 ($i/5) - 다른 워크플로우가 먼저 push한 것으로 보입니다. 원격 변경사항을 받아와 재시도합니다."
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "::error::rebase 충돌 발생 - 자동 해결이 불가능해 수동 확인이 필요합니다."
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 6 + 2))
          done
          echo "::error::5회 재시도 후에도 push에 실패했습니다."
          exit 1
