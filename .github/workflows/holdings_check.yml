name: 보유종목 추적

# ⚠️ schedule(GitHub 자체 cron) 트리거를 의도적으로 제거함.
# cron-job.org가 GitHub API로 5분마다 workflow_dispatch를 정확히 호출해주고 있는데,
# 여기에 GitHub 자체 schedule('*/5 * * * *')까지 같이 켜져 있으면 두 트리거가 각각
# 별도로 이 워크플로우를 실행시켜서 "1분에 한 번씩 오는" 것처럼 보이는 중복 실행이
# 발생했음. workflow_dispatch만 남겨서 cron-job.org의 5분 호출로만 돌게 함.
#
# [2026-09-24 변경사항 - 전체 교체]
# 🐛 watchlist_check.py 파일 자체 설명("holdings_check.yml 안에서 실행되며...")과
# 달리, 실제로는 이 워크플로우가 watchlist_check.py를 호출하는 스텝이 아예 없었음.
# 그래서 텔레그램 "코드 추적시작"으로 등록해도 5분마다 자동으로 관심/진입/청산
# 상태를 알려주는 기능이 한 번도 동작하지 않았고, 사람이 "추적확인"을 직접
# 입력했을 때만(그 순간 값을 즉석에서 재조회하는 handle_track_check) 상태를 볼 수
# 있었음. "감시목록(집중추적종목) 체크" 스텝을 추가해서 매 실행(5분)마다
# watchlist_check.py가 실제로 돌도록 연결하고, 결과 커밋 대상에도
# data/watchlist.csv를 추가함.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 텔레그램 명령어 처리 (등록/청산/조회)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_listener.py

      - name: 보유종목 목표가/손절가 체크
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/holdings_check.py

      # 2026-09-24 신규: 위 "텔레그램 명령어 처리" 스텝에서 방금 등록됐을 수 있는
      # 추적종목까지 포함해서, 감시목록(watchlist.csv) 전체를 이번 실행에서 바로
      # 재확인한다. 이게 빠져 있어서 "추적시작"을 해도 5분 자동 알림이 전혀
      # 오지 않던 문제의 원인이었음.
      - name: 감시목록(집중추적종목) 체크
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watchlist_check.py

      # [2026-09-22 8차 수정 - 전체 교체]
      # 🔴 이 저장소엔 5분마다 도는 워크플로우(보유종목 추적, 관심종목 재확인),
      # 텔레그램 메시지가 올 때마다 즉시 도는 웹훅, 그리고 하루 여러 번(또는 매시간)
      # 도는 전체스캔들까지 여러 워크플로우가 동시에 같은 data/ 폴더에 git push를
      # 시도합니다. 기존에는 이 스텝이 단순히 "commit 후 push"만 하고 있어서,
      # 다른 워크플로우가 그 사이에 먼저 push해버리면 이 push는 그냥
      # "non-fast-forward"로 거부되고 실패합니다 - 재시도 로직이 전혀 없었기
      # 때문에, 이 워크플로우가 방금 만든 변경사항이 원격 저장소에 반영되지
      # 못한 채 통째로 유실되는 문제가 있었습니다(예: buy 명령으로 보유종목을
      # 등록했다는 텔레그램 답장은 받았지만 실제로는 push가 실패해서
      # holdings.csv에는 저장이 안 되고, list에는 안 보이는 증상).
      # 수정: push가 거부되면 원격의 최신 커밋을 rebase로 받아온 뒤 최대 5회까지
      # 재시도하도록 변경. rebase 충돌이 발생하면 자동 해결을 시도하지 않고
      # 명확히 실패시켜서 데이터가 조용히 깨지는 것을 방지합니다.
      #
      # 2026-09-24 변경: git add 대상에 data/watchlist.csv를 추가함
      # (watchlist_check.py 스텝이 새로 생겼으므로 그 결과도 커밋되어야 함).
      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/holdings.csv data/telegram_offset.txt data/watchlist.csv

          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 스킵"
            exit 0
          fi

          git commit -m "보유종목/집중추적종목 상태 업데이트"

          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "푸시 성공 (시도 $i회)"
              exit 0
            fi
            echo "푸시 실패 ($i/5) - 다른 워크플로우가 먼저 push한 것으로 보입니다. 원격 변경사항을 받아와 재시도합니다."
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "::error::rebase 충돌 발생 - 자동 해결이 불가능해 수동 확인이 필요합니다."
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 6 + 2))
          done
          echo "::error::5회 재시도 후에도 push에 실패했습니다."
          exit 1
