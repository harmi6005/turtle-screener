name: 관심종목 재확인

on:
  schedule:
    # 5분마다 (GitHub Actions 최소 간격)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 관심종목 재확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_korea.py

      - name: 미국 관심종목 재확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_us.py

      - name: 빗썸 관심코인 재확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_bithumb.py

      - name: 결과 커밋
        run: |
          git config user.name "turtle-bot"
          git config user.email "turtle-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "관심종목 재확인 결과 업데이트"
          git push
